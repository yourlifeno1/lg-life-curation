name: Daily Trend Data Update

on:
  schedule:
    # 매일 아침 한국 시간(KST) 오전 8시 30분에 자동 실행 (UTC 23:30)
    - cron: '30 23 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/checkout@v3 # 파이썬 실행 환경 구축
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run TOP Crawler
        run: python trend_crawler.py
        # 순위 데이터를 먼저 수집하여 시트의 기초를 잡습니다.

      - name: Run AGE Crawler
        run: python age_crawler.py
        # 연령별 데이터를 수집하여 정밀 분석 데이터를 채웁니다.
