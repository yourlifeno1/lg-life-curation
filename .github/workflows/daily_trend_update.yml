name: Daily Trend Data Update

on:
  schedule:
    # 매일 한국 시간(KST) 낮 12시 30분에 실행 (UTC 03:30)
    # *참고: 30 3 * * * 은 한국 시간으로 오후 12시 30분입니다!*
    - cron: '30 3 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests pandas

      - name: Run TOP Crawler
        env:
          # 파이썬의 os.environ.get("NAVER_CLIENT_ID")와 연결됩니다.
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GAS_URL: ${{ secrets.GAS_URL }}
        run: python trend_crawler.py

      - name: Run AGE Crawler
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GAS_URL: ${{ secrets.GAS_URL }}
        run: python age_crawler.py
